<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A simple welcome web app.">
<title>Welcome</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; color: #eef2ff; background: radial-gradient(ellipse at top, #26356a, #0d1226 70%); }
main { width: min(100%, 540px); text-align: center; padding: 64px 28px; border: 1px solid #ffffff26; border-radius: 28px; background: #ffffff08; box-shadow: 0 24px 80px #0004; }
.icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 28px; border-radius: 20px; background: #a5b4fc; color: #172044; font-size: 32px; }
h1 { margin: 0 0 16px; font-size: clamp(40px, 10vw, 64px); letter-spacing: -0.04em; }
p { margin: 0; color: #c4cce5; font-size: 18px; line-height: 1.6; }
</style>
</head>
<body>
<main>
<div class="icon" aria-hidden="true">✦</div>
<h1>Welcome</h1>
<p>Glad you're here. Enjoy your new web app!</p>
</main>
</body>
</html>
